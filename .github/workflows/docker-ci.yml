name: Docker CI

on:
  # pull_requestと重複してPRブランチで二重ビルドされるのを避けるため、
  # pushはmaster（レジストリへpushする経路）のみ
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# イメージはDockerfileではなくnix（dockerTools.streamLayeredImage）でビルドする。
# 定義は docker/images.nix / flake.nix の packages 出力を参照。
jobs:
  docker-build:
    name: Build & Push Docker Image (nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # イメージ2つ+nix storeでrunnerのディスク(14GB)が尽きるため、
      # 不要なプリインストールを削除して空きを確保する
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # streamLayeredImageの成果物はイメージtarをstdoutへ流すスクリプト
      - name: Build runtime image
        run: |
          nix build .#docker-runtime -o stream-runtime -L
          ./stream-runtime | docker load

      - name: Build dev image
        run: |
          nix build .#docker-dev -o stream-dev -L
          ./stream-dev | docker load

      - name: Smoke test
        run: |
          echo "=== Installed packages (runtime) ==="
          docker run --rm devenv:latest sh -c 'ls /home/illumination-k/result/home-path/bin | sort'
          docker run --rm devenv:latest sh -c 'zsh --version && hx --version'
          echo "=== dev image ==="
          docker run --rm --entrypoint /bin/sh devenv-dev:latest -c \
            'id illumination-k && herdr --version && test -f /etc/ssh/sshd_config && test -x /usr/local/bin/entrypoint-dev.sh && test -x /usr/local/bin/dev-login'
          echo "=== nix-ld (FHS binary support) ==="
          docker run --rm --entrypoint /bin/sh devenv-dev:latest -c \
            'test -e /lib64/ld-linux-x86-64.so.2 && [ -n "$NIX_LD" ] && [ -e "$NIX_LD" ] && [ -n "$NIX_LD_LIBRARY_PATH" ]'

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/master'
        run: |
          for img in devenv devenv-dev; do
            docker tag "${img}:latest" "ghcr.io/${{ github.repository_owner }}/${img}:latest"
            docker tag "${img}:latest" "ghcr.io/${{ github.repository_owner }}/${img}:${{ github.sha }}"
            docker push "ghcr.io/${{ github.repository_owner }}/${img}:latest"
            docker push "ghcr.io/${{ github.repository_owner }}/${img}:${{ github.sha }}"
          done
