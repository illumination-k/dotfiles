name: Update flake.lock

on:
  schedule:
    # 毎週土曜 6:00 JST（金曜 21:00 UTC）
    - cron: '0 21 * * 5'
  workflow_dispatch:

jobs:
  update-flake-lock:
    name: Update flake.lock & Open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # GITHUB_TOKENで作られたPRにはCI（Nix CI / Docker CI）が走らない制約があるため、
      # CIを走らせたい場合はrepo scopeのPATをsecrets.FLAKE_UPDATE_TOKENに設定する。
      # 未設定時はGITHUB_TOKENにフォールバック（PRは作られるがCIは手動トリガーが必要）。
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          pr-title: 'chore: update flake.lock'
          pr-labels: |
            dependencies
            automated
          commit-msg: 'chore: update flake.lock'
